[project]
name = "backend"
version = "0.1.0"
description = "Private lead generation platform for digital services sales — Google Places discovery, website scraping, scoring, AI drafts, and mini-CRM"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "google-genai>=2.8.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.30",
    "selectolax>=0.4.10",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # style errors (PEP 8)
    "F",   # logic errors (unused variables, unused imports)
    "I",   # import ordering
    "N",   # naming conventions (snake_case, PascalCase)
    "ANN", # missing type hints
    "S",   # security (detects dangerous patterns)
    "UP",  # upgrade outdated Python syntax
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # allow assert in tests
