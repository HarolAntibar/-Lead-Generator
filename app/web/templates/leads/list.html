{% extends "base.html" %}
{% block title %}Leads — Lead Generator{% endblock %}

{% block content %}
<h2>Leads</h2>

<div style="display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:1rem;">
  <label style="margin:0;">
    Status
    <select
      id="filter-status"
      hx-get="/leads/table"
      hx-target="#leads-table"
      hx-swap="outerHTML"
      hx-include="#filter-status, #filter-opp-type"
      name="status"
    >
      <option value="">All</option>
      {% for s in all_statuses %}
        <option value="{{ s.value }}" {% if s == status_filter %}selected{% endif %}>
          {{ s.value | capitalize }}
        </option>
      {% endfor %}
    </select>
  </label>

  <label style="margin:0;">
    Opportunity
    <select
      id="filter-opp-type"
      hx-get="/leads/table"
      hx-target="#leads-table"
      hx-swap="outerHTML"
      hx-include="#filter-status, #filter-opp-type"
      name="opportunity_type"
    >
      <option value="">All</option>
      {% for ot in all_opportunity_types %}
        <option value="{{ ot }}" {% if ot == opportunity_type_filter %}selected{% endif %}>
          {{ ot | capitalize }}
        </option>
      {% endfor %}
    </select>
  </label>

  <small style="color:var(--pico-color-grey-500);">{{ leads | length }} lead{{ 's' if leads | length != 1 else '' }}</small>

  <div style="margin-left:auto; display:flex; gap:0.5rem;">
    <a
      href="/api/leads/export?format=csv{% if status_filter %}&status={{ status_filter.value }}{% endif %}{% if opportunity_type_filter %}&opportunity_type={{ opportunity_type_filter }}{% endif %}"
      role="button"
      class="outline"
      style="padding:0.3rem 0.8rem; font-size:0.85rem;"
    >CSV</a>
    <a
      href="/api/leads/export?format=xlsx{% if status_filter %}&status={{ status_filter.value }}{% endif %}{% if opportunity_type_filter %}&opportunity_type={{ opportunity_type_filter }}{% endif %}"
      role="button"
      class="outline"
      style="padding:0.3rem 0.8rem; font-size:0.85rem;"
    >Excel</a>
  </div>
</div>

{% include "leads/_table.html" %}
{% endblock %}
