{% extends "base.html" %}
{% block title %}Run {{ run.id }} — {{ campaign.name }}{% endblock %}

{% block content %}
<a href="/campaigns/{{ campaign.id }}">Back to {{ campaign.name }}</a>

<h2>Search run #{{ run.id }}</h2>

<div id="run-status-container">
    {% with campaign_id=campaign.id %}
        {% include "campaigns/_run_poll.html" %}
    {% endwith %}
</div>
{% endblock %}
