<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lead Generator{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-pending  { color: var(--pico-color-grey-500); }
        .status-running  { color: var(--pico-color-blue-500); }
        .status-done     { color: var(--pico-color-green-500); }
        .status-error    { color: var(--pico-color-red-500); }
        .sort-active     { font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>
    <header class="container">
        <nav>
            <ul><li><strong>Lead Generator</strong></li></ul>
            <ul>
                <li><a href="/campaigns">Campaigns</a></li>
                <li><a href="/businesses">Businesses</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
