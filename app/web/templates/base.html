<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lead Generator{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        /* ── Dark theme overrides ──────────────────────────────────────────── */
        :root {
          --pico-background-color:                  #0d1117;
          --pico-card-background-color:             #131720;
          --pico-card-sectioning-background-color:  #131720;
          --pico-card-border-color:                 rgba(255, 255, 255, 0.07);
          --pico-table-border-color:                rgba(255, 255, 255, 0.06);
          --pico-muted-border-color:                rgba(255, 255, 255, 0.06);
        }

        body {
          background: radial-gradient(ellipse 80% 50% at 50% -10%, #1a2235 0%, #0d1117 55%);
          min-height: 100vh;
        }

        /* ── Sticky nav with glass blur ────────────────────────────────────── */
        header {
          position: sticky;
          top: 0;
          z-index: 100;
          background: rgba(13, 17, 23, 0.82);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ── Utilities ─────────────────────────────────────────────────────── */
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-pending  { color: var(--pico-color-grey-500); }
        .status-running  { color: var(--pico-color-blue-400); }
        .status-done     { color: var(--pico-color-green-400); }
        .status-error    { color: var(--pico-color-red-400); }
        .sort-active     { font-weight: bold; text-decoration: underline; }

        /* Lead status badges — brighter tones for dark bg */
        .lead-new        { color: var(--pico-color-grey-400); }
        .lead-contacted  { color: var(--pico-color-blue-400); }
        .lead-interested { color: var(--pico-color-green-400); }
        .lead-discarded  { color: var(--pico-color-red-400); }
        .lead-client     { color: var(--pico-color-green-300); font-weight: bold; }

        /* Score badges */
        .score-high   { color: var(--pico-color-green-400); font-weight: bold; }
        .score-medium { color: var(--pico-color-orange-400); font-weight: bold; }
        .score-low    { color: var(--pico-color-grey-500); }

        /* Opportunity type badges */
        .opp-website    { color: var(--pico-color-blue-400); }
        .opp-automation { color: var(--pico-color-purple-400); }
        .opp-both       { color: var(--pico-color-orange-400); }
        .opp-low        { color: var(--pico-color-grey-500); }

        /* Score breakdown collapsible */
        details.score-breakdown summary { cursor: pointer; list-style: none; }
        details.score-breakdown summary::-webkit-details-marker { display: none; }
        details.score-breakdown[open] { background: var(--pico-card-background-color); border-radius: 4px; padding: 0.5rem; }
        .breakdown-table { width: 100%; font-size: 0.8rem; margin-top: 0.4rem; }
        .breakdown-table td { padding: 0.15rem 0.3rem; }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
    <header>
        <nav class="container">
            <ul><li><strong>Lead Generator</strong></li></ul>
            <ul>
                <li><a href="/campaigns">Campaigns</a></li>
                <li><a href="/businesses">Businesses</a></li>
                <li><a href="/leads">Leads</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
