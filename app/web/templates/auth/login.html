<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>LeadNexus Pro - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed-variant": "#005236",
                        "on-secondary-fixed": "#002022",
                        "on-primary-container": "#ede0ff",
                        "surface-bright": "#363847",
                        "on-surface-variant": "#ccc3d8",
                        "surface-container-highest": "#323442",
                        "on-error-container": "#ffdad6",
                        "on-tertiary": "#003824",
                        "secondary": "#46effb",
                        "on-secondary-container": "#00565b",
                        "inverse-primary": "#732ee4",
                        "surface-dim": "#10131f",
                        "surface": "#10131f",
                        "outline": "#958da1",
                        "surface-container-low": "#191b28",
                        "surface-container": "#1d1f2c",
                        "primary-container": "#7c3aed",
                        "secondary-fixed": "#77f5ff",
                        "on-background": "#e1e1f4",
                        "surface-container-high": "#272937",
                        "error": "#ffb4ab",
                        "on-primary": "#3f008e",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-tint": "#d2bbff",
                        "background": "#10131f",
                        "surface-variant": "#323442",
                        "tertiary": "#4edea3",
                        "secondary-container": "#00d2de",
                        "outline-variant": "#4a4455",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#25005a",
                        "inverse-on-surface": "#2e2f3e",
                        "secondary-fixed-dim": "#1fdbe7",
                        "primary": "#d2bbff",
                        "on-surface": "#e1e1f4",
                        "on-error": "#690005",
                        "inverse-surface": "#e1e1f4",
                        "on-secondary-fixed-variant": "#004f54",
                        "on-secondary": "#00363a",
                        "primary-fixed-dim": "#d2bbff",
                        "primary-fixed": "#eaddff",
                        "on-tertiary-fixed": "#002113",
                        "tertiary-container": "#007650",
                        "surface-container-lowest": "#0b0d1a",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-primary-fixed-variant": "#5a00c6",
                        "on-tertiary-container": "#76ffc2"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "label-caps": ["JetBrains Mono"],
                        "headline-xl": ["Hanken Grotesk"],
                        "technical-data": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    fontSize: {
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "headline-xl": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "technical-data": ["13px", { lineHeight: "18px", fontWeight: "500" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(29, 31, 44, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .input-glow:focus-within {
            box-shadow: 0 0 0 1px #7c3aed, 0 0 12px rgba(124, 58, 237, 0.2);
            border-color: #7c3aed;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface h-screen overflow-hidden flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">

    <!-- Decorative background glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-container/10 blur-[120px]"></div>
        <div class="absolute bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-secondary-container/10 blur-[100px]"></div>
    </div>

    <!-- Login container -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center w-full max-w-[343px] mx-auto px-4 py-4">

        <!-- Card -->
        <div class="glass-panel border border-outline-variant rounded-xl p-4 shadow-2xl relative overflow-hidden w-full">

            <!-- Gradient top strip -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-container to-secondary-container"></div>

            <!-- Brand header -->
            <div class="flex flex-col items-center mb-3 text-center">
                <div class="w-8 h-8 bg-surface-container-low rounded-lg border border-outline-variant flex items-center justify-center mb-3 shadow-inner">
                    <span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">dataset</span>
                </div>
                <h1 class="font-headline-md text-headline-md text-on-surface mb-1">Welcome Back</h1>
                <p class="font-body-sm text-body-sm text-on-surface-variant">Enter your credentials to access your workspace.</p>
            </div>

            <!-- Error message -->
            {% if error %}
            <div class="mb-6 px-4 py-3 rounded-lg bg-error-container/20 border border-error/30 text-error font-body-sm text-body-sm">
                {{ error }}
            </div>
            {% endif %}

            <!-- Login form -->
            <form
                class="space-y-2"
                method="POST"
                action="/auth/login{% if request.query_params.get('next') %}?next={{ request.query_params.get('next') }}{% endif %}"
            >
                <!-- Email -->
                <div class="space-y-2">
                    <label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">
                        Email Address
                    </label>
                    <div class="relative rounded-lg overflow-hidden border border-outline-variant bg-surface-container-low transition-all duration-200 input-glow">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-outline text-sm">mail</span>
                        </div>
                        <input
                            class="block w-full pl-10 pr-3 py-2 bg-transparent border-none text-on-surface font-body-sm text-body-sm font-medium placeholder:text-outline focus:ring-0 focus:outline-none"
                            id="email"
                            name="email"
                            placeholder="name@company.com"
                            required
                            type="email"
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">
                            Password
                        </label>
                        <a class="font-body-sm text-body-sm text-secondary hover:text-secondary-fixed transition-colors" href="#">
                            Forgot password?
                        </a>
                    </div>
                    <div class="relative rounded-lg overflow-hidden border border-outline-variant bg-surface-container-low transition-all duration-200 input-glow">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-outline text-sm">lock</span>
                        </div>
                        <input
                            class="block w-full pl-10 pr-3 py-2 bg-transparent border-none text-on-surface font-body-sm text-body-sm font-medium placeholder:text-outline focus:ring-0 focus:outline-none"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            type="password"
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <!-- Remember me -->
                <div class="flex items-center">
                    <input
                        class="h-4 w-4 rounded border-outline-variant bg-surface-container-low text-primary-container focus:ring-primary focus:ring-offset-surface-container-lowest"
                        id="remember-me"
                        name="remember-me"
                        type="checkbox"
                    >
                    <label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Remember me for 30 days
                    </label>
                </div>

                <!-- Submit -->
                <button
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm font-body-md text-body-md font-medium text-white bg-primary-container hover:bg-inverse-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-surface-container-lowest transition-colors duration-200"
                    type="submit"
                >
                    Sign In
                </button>

                <!-- Google SSO — not yet implemented, wired for future OAuth integration -->
                <button
                    type="button"
                    class="w-full flex items-center justify-center gap-2 py-2 px-4 border border-outline-variant rounded-lg shadow-sm font-body-md text-body-md font-medium text-on-surface bg-transparent hover:bg-surface-container-high transition-colors duration-200"
                >
                    <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Sign in with Google
                </button>
            </form>

        </div>

        <!-- Below-card link -->
        <p class="mt-3 text-center font-body-sm text-body-sm text-on-surface-variant">
            Don't have an account?
            <a class="font-medium text-primary hover:text-primary-fixed transition-colors" href="#">Contact Sales</a>
        </p>

    </main>

    <!-- Footer -->
    <footer class="shrink-0 w-full flex flex-col md:flex-row justify-center items-center gap-4 py-3 z-0 opacity-60">
        <span class="font-label-caps text-label-caps text-on-surface-variant">&copy; 2024 LeadNexus Pro. All rights reserved.</span>
        <div class="flex gap-4">
            <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-secondary transition-colors" href="#">Privacy Policy</a>
            <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-secondary transition-colors" href="#">Terms of Service</a>
            <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-secondary transition-colors" href="#">Security</a>
        </div>
    </footer>

</body>
</html>
